spring:
  application:
    name: market-data-service

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        # Health and info only. The prometheus endpoint is added in Phase 6 together with
        # micrometer-registry-prometheus; listing it before the dependency exists would be
        # config that silently does nothing.
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.taxlot: INFO
